# Render Blueprint: one web service (Next.js app + API) and one Postgres database.
# Connect the GitHub repo in Render → New → Blueprint. Values marked sync: false are asked for once.
services:
  - type: web
    name: guardrail
    runtime: node
    region: frankfurt
    # TEMPORARY until submission (11-11): free while testing. Free instances sleep after inactivity
    # (≈50 s cold start), so switch to `starter` on submission day to keep the jury link instant.
    plan: free
    # Dev dependencies are needed at runtime for the migration and seed scripts (tsx).
    buildCommand: npm ci --include=dev && npm run build
    # Migrations and seeds are idempotent, so every deploy and restart is safe.
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: guardrail-db
          property: connectionString
      - key: DEMO_ADMIN_TOKEN
        generateValue: true
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_VAULT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYEE_EMAIL_NORDIC_GEAR
        sync: false
      - key: PAYEE_EMAIL_EU_SPORTDIRECT
        sync: false
      - key: PAYEE_EMAIL_DEALZONE_X
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: guardrail-db
    region: frankfurt
    # TEMPORARY until submission (11-11): free while testing. The free database expires after 30 days
    # and the jury may open the link until 21-12, so switch to `basic-256mb` on submission day.
    plan: free
    postgresMajorVersion: "17"
